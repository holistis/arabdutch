<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8C16C"/>
      <stop offset="1" stop-color="#A67C1E"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="#0F1A30"/>

  <!-- Subtle bridge arch ABOVE Arabic -->
  <path d="M 80 90 Q 200 50 320 90" fill="none" stroke="url(#g5)" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>

  <!-- Mini windmill at left of arch -->
  <g transform="translate(85 90)">
    <circle r="2" fill="#D4A847"/>
    <line x1="0" y1="0" x2="0" y2="-12" stroke="#D4A847" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="10" y2="6" stroke="#D4A847" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-10" y2="6" stroke="#D4A847" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="10" y2="-6" stroke="#D4A847" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- Mini crescent at right of arch -->
  <g transform="translate(315 90)">
    <path d="M 0 -9 A 9 9 0 1 0 0 9 A 7 7 0 1 1 0 -9" fill="#D4A847"/>
  </g>

  <!-- BIG bold Arabic calligraphy - centerpiece -->
  <text x="200" y="190" font-family="'Amiri', 'Scheherazade New', 'Noto Naskh Arabic', serif"
        font-size="120" fill="url(#g5)" text-anchor="middle" font-weight="700"
        direction="rtl">
    عرب داتش
  </text>

  <!-- Elegant underline -->
  <line x1="120" y1="220" x2="280" y2="220" stroke="url(#g5)" stroke-width="1"/>
  <circle cx="200" cy="220" r="2" fill="#D4A847"/>

  <!-- Bottom decorative element -->
  <g transform="translate(200 245)" fill="#D4A847" opacity="0.7">
    <circle r="1.5"/>
    <circle cx="-15" r="1"/>
    <circle cx="15" r="1"/>
    <circle cx="-30" r="0.7"/>
    <circle cx="30" r="0.7"/>
  </g>
</svg>
