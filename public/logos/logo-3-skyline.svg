<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A67C1E"/>
      <stop offset="0.5" stop-color="#E8C16C"/>
      <stop offset="1" stop-color="#A67C1E"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="#0F1A30"/>

  <!-- Top scene: windmill left, dome right, bridge between -->
  <!-- Windmill -->
  <g transform="translate(85 100)">
    <polygon points="-10,30 10,30 7,-5 -7,-5" fill="url(#g3)"/>
    <ellipse cx="0" cy="-5" rx="8" ry="3" fill="#D4A847"/>
    <circle cx="0" cy="-7" r="2.5" fill="#0F1A30" stroke="#D4A847" stroke-width="1"/>
    <line x1="0" y1="-7" x2="0" y2="-26" stroke="#D4A847" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="0" y1="-7" x2="17" y2="3" stroke="#D4A847" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="0" y1="-7" x2="-17" y2="3" stroke="#D4A847" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="0" y1="-7" x2="17" y2="-17" stroke="#D4A847" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Bridge -->
  <path d="M 100 130 Q 200 60 300 130" fill="none" stroke="url(#g3)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 100 130 Q 200 80 300 130" fill="none" stroke="#D4A847" stroke-width="0.8" opacity="0.5"/>
  <line x1="100" y1="130" x2="300" y2="130" stroke="url(#g3)" stroke-width="1.5"/>

  <!-- Arabic dome -->
  <g transform="translate(315 100)">
    <path d="M -16 30 L -16 5 Q -16 -15 0 -15 Q 16 -15 16 5 L 16 30 Z" fill="url(#g3)"/>
    <line x1="0" y1="-15" x2="0" y2="-32" stroke="#D4A847" stroke-width="2"/>
    <circle cx="0" cy="-34" r="2.5" fill="#D4A847"/>
    <path d="M 0 -42 A 4.5 4.5 0 1 0 0 -34 A 3.5 3.5 0 1 1 0 -42" fill="#D4A847"/>
  </g>

  <!-- Arabic calligraphy below scene -->
  <text x="200" y="220" font-family="'Amiri', 'Scheherazade New', 'Noto Naskh Arabic', serif"
        font-size="78" fill="url(#g3)" text-anchor="middle" font-weight="700"
        direction="rtl">
    عرب داتش
  </text>

  <!-- Decorative bottom line with diamonds -->
  <line x1="120" y1="250" x2="180" y2="250" stroke="#D4A847" stroke-width="1" opacity="0.6"/>
  <polygon points="200,247 204,250 200,253 196,250" fill="#D4A847"/>
  <line x1="220" y1="250" x2="280" y2="250" stroke="#D4A847" stroke-width="1" opacity="0.6"/>
</svg>
