<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@700&display=swap');</style>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0CC74"/>
      <stop offset="0.5" stop-color="#D4A847"/>
      <stop offset="1" stop-color="#8B6515"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" fill="#0F1A30"/>

  <!-- Geometric Islamic frame top -->
  <g stroke="url(#g1)" fill="none" stroke-width="1.5">
    <rect x="40" y="40" width="420" height="240"/>
    <rect x="50" y="50" width="400" height="220" stroke="#D4A847" stroke-width="0.5" opacity="0.6"/>
  </g>

  <!-- Corner ornaments (8-point stars) -->
  <g fill="url(#g1)">
    <g transform="translate(40 40)">
      <polygon points="0,-4 3,-3 4,0 3,3 0,4 -3,3 -4,0 -3,-3"/>
    </g>
    <g transform="translate(460 40)">
      <polygon points="0,-4 3,-3 4,0 3,3 0,4 -3,3 -4,0 -3,-3"/>
    </g>
    <g transform="translate(40 280)">
      <polygon points="0,-4 3,-3 4,0 3,3 0,4 -3,3 -4,0 -3,-3"/>
    </g>
    <g transform="translate(460 280)">
      <polygon points="0,-4 3,-3 4,0 3,3 0,4 -3,3 -4,0 -3,-3"/>
    </g>
  </g>

  <!-- Top geometric band -->
  <g transform="translate(250 75)">
    <line x1="-150" y1="0" x2="-30" y2="0" stroke="url(#g1)" stroke-width="0.8"/>
    <line x1="30" y1="0" x2="150" y2="0" stroke="url(#g1)" stroke-width="0.8"/>
    <polygon points="0,-7 5,-3 7,3 0,8 -7,3 -5,-3" fill="url(#g1)"/>
    <polygon points="0,-3 2,-1 3,1 0,4 -3,1 -2,-1" fill="#0F1A30"/>
  </g>

  <!-- Reem Kufi Arabic - geometric ancient style -->
  <text x="250" y="180" font-family="'Reem Kufi', 'Noto Kufi Arabic', sans-serif"
        font-size="92" fill="url(#g1)" text-anchor="middle" font-weight="700"
        direction="rtl" letter-spacing="2">
    عرب داتش
  </text>

  <!-- Bridge below text -->
  <path d="M 100 220 Q 250 250 400 220" fill="none" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="220" x2="400" y2="220" stroke="url(#g1)" stroke-width="1.2"/>

  <!-- Windmill -->
  <g transform="translate(105 220)">
    <circle r="3" fill="#D4A847"/>
    <line x1="0" y1="0" x2="0" y2="-20" stroke="#D4A847" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="17" y2="10" stroke="#D4A847" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-17" y2="10" stroke="#D4A847" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="17" y2="-10" stroke="#D4A847" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Crescent -->
  <g transform="translate(395 220)">
    <path d="M 0 -14 A 14 14 0 1 0 0 14 A 11 11 0 1 1 0 -14" fill="url(#g1)"/>
  </g>

  <!-- Bottom geometric band -->
  <g transform="translate(250 255)">
    <line x1="-150" y1="0" x2="-30" y2="0" stroke="url(#g1)" stroke-width="0.8"/>
    <line x1="30" y1="0" x2="150" y2="0" stroke="url(#g1)" stroke-width="0.8"/>
    <polygon points="-15,-3 -10,0 -15,3" fill="#D4A847"/>
    <polygon points="15,-3 10,0 15,3" fill="#D4A847"/>
    <circle r="2.5" fill="url(#g1)"/>
  </g>
</svg>
