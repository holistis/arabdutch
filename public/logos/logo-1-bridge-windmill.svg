<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="500" height="360">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@700&display=swap');</style>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0CC74"/>
      <stop offset="0.5" stop-color="#D4A847"/>
      <stop offset="1" stop-color="#8B6515"/>
    </linearGradient>
    <pattern id="sebka1" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 15 0 L 30 15 L 15 30 L 0 15 Z" fill="none" stroke="#D4A847" stroke-width="0.6" opacity="0.4"/>
      <circle cx="15" cy="15" r="2" fill="#D4A847" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="500" height="360" fill="#0F1A30"/>

  <!-- Sebka pattern background sides -->
  <rect x="0" y="0" width="60" height="360" fill="url(#sebka1)"/>
  <rect x="440" y="0" width="60" height="360" fill="url(#sebka1)"/>

  <!-- Outer ornate frame -->
  <rect x="70" y="40" width="360" height="280" fill="none" stroke="url(#g1)" stroke-width="2"/>
  <rect x="78" y="48" width="344" height="264" fill="none" stroke="#D4A847" stroke-width="0.5" opacity="0.6"/>

  <!-- Corner 8-point star ornaments -->
  <g fill="url(#g1)">
    <g transform="translate(70 40)">
      <polygon points="0,-8 3,-3 8,0 3,3 0,8 -3,3 -8,0 -3,-3"/>
      <polygon points="0,-5 2,-2 5,0 2,2 0,5 -2,2 -5,0 -2,-2" fill="#0F1A30"/>
    </g>
    <g transform="translate(430 40)">
      <polygon points="0,-8 3,-3 8,0 3,3 0,8 -3,3 -8,0 -3,-3"/>
      <polygon points="0,-5 2,-2 5,0 2,2 0,5 -2,2 -5,0 -2,-2" fill="#0F1A30"/>
    </g>
    <g transform="translate(70 320)">
      <polygon points="0,-8 3,-3 8,0 3,3 0,8 -3,3 -8,0 -3,-3"/>
      <polygon points="0,-5 2,-2 5,0 2,2 0,5 -2,2 -5,0 -2,-2" fill="#0F1A30"/>
    </g>
    <g transform="translate(430 320)">
      <polygon points="0,-8 3,-3 8,0 3,3 0,8 -3,3 -8,0 -3,-3"/>
      <polygon points="0,-5 2,-2 5,0 2,2 0,5 -2,2 -5,0 -2,-2" fill="#0F1A30"/>
    </g>
  </g>

  <!-- Top geometric band -->
  <g transform="translate(250 80)" stroke="url(#g1)" fill="none" stroke-width="1">
    <line x1="-145" y1="0" x2="-25" y2="0"/>
    <line x1="25" y1="0" x2="145" y2="0"/>
    <polygon points="-8,-8 8,-8 8,8 -8,8" transform="rotate(45)" fill="url(#g1)"/>
    <polygon points="-4,-4 4,-4 4,4 -4,4" transform="rotate(45)" fill="#0F1A30"/>
  </g>

  <!-- Geometric interlace pattern bands -->
  <g stroke="url(#g1)" fill="none" stroke-width="0.8">
    <path d="M 90 100 L 110 110 L 130 100 L 150 110 L 170 100 L 190 110 L 210 100 L 230 110 L 250 100 L 270 110 L 290 100 L 310 110 L 330 100 L 350 110 L 370 100 L 390 110 L 410 100"/>
    <path d="M 90 110 L 110 100 L 130 110 L 150 100 L 170 110 L 190 100 L 210 110 L 230 100 L 250 110 L 270 100 L 290 110 L 310 100 L 330 110 L 350 100 L 370 110 L 390 100 L 410 110"/>
  </g>

  <!-- Kufic Arabic - centerpiece -->
  <text x="250" y="200" font-family="'Reem Kufi', sans-serif"
        font-size="88" fill="url(#g1)" text-anchor="middle" font-weight="700"
        direction="rtl" letter-spacing="3">
    عرب داتش
  </text>

  <!-- Inner geometric divider -->
  <g transform="translate(250 230)">
    <line x1="-120" y1="0" x2="-20" y2="0" stroke="url(#g1)" stroke-width="0.8"/>
    <line x1="20" y1="0" x2="120" y2="0" stroke="url(#g1)" stroke-width="0.8"/>
    <polygon points="0,-5 5,0 0,5 -5,0" fill="url(#g1)"/>
  </g>

  <!-- Bridge -->
  <path d="M 100 270 Q 250 295 400 270" fill="none" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="270" x2="400" y2="270" stroke="url(#g1)" stroke-width="1.2"/>

  <!-- Windmill -->
  <g transform="translate(105 270)">
    <circle r="3" fill="#D4A847"/>
    <line x1="0" y1="0" x2="0" y2="-18" stroke="#D4A847" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="15" y2="9" stroke="#D4A847" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-15" y2="9" stroke="#D4A847" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="15" y2="-9" stroke="#D4A847" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Crescent -->
  <g transform="translate(395 270)">
    <path d="M 0 -13 A 13 13 0 1 0 0 13 A 10 10 0 1 1 0 -13" fill="url(#g1)"/>
  </g>

  <!-- Bottom geometric interlace -->
  <g stroke="url(#g1)" fill="none" stroke-width="0.8">
    <path d="M 90 295 L 110 305 L 130 295 L 150 305 L 170 295 L 190 305 L 210 295 L 230 305 L 250 295 L 270 305 L 290 295 L 310 305 L 330 295 L 350 305 L 370 295 L 390 305 L 410 295"/>
    <path d="M 90 305 L 110 295 L 130 305 L 150 295 L 170 305 L 190 295 L 210 305 L 230 295 L 250 305 L 270 295 L 290 305 L 310 295 L 330 305 L 350 295 L 370 305 L 390 295 L 410 305"/>
  </g>
</svg>
