<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8C16C"/>
      <stop offset="0.5" stop-color="#D4A847"/>
      <stop offset="1" stop-color="#A67C1E"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="#0F1A30"/>

  <!-- Decorative top arch -->
  <path d="M 100 70 Q 200 30 300 70" fill="none" stroke="url(#g1)" stroke-width="1.5" opacity="0.7"/>
  <path d="M 110 75 Q 200 40 290 75" fill="none" stroke="#D4A847" stroke-width="0.5" opacity="0.4"/>

  <!-- Bold Arabic Calligraphy - Centerpiece -->
  <text x="200" y="170" font-family="'Amiri', 'Scheherazade New', 'Noto Naskh Arabic', 'Times New Roman', serif"
        font-size="100" fill="url(#g1)" text-anchor="middle" font-weight="700"
        direction="rtl" style="font-feature-settings: 'liga' on, 'calt' on;">
    عرب داتش
  </text>

  <!-- Bridge underline -->
  <path d="M 80 200 Q 200 230 320 200" fill="none" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="80" y1="200" x2="320" y2="200" stroke="#D4A847" stroke-width="0.5" opacity="0.5"/>

  <!-- Windmill on left of bridge -->
  <g transform="translate(85 200)">
    <circle r="3" fill="#D4A847"/>
    <line x1="0" y1="0" x2="0" y2="-18" stroke="#D4A847" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="16" y2="9" stroke="#D4A847" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-16" y2="9" stroke="#D4A847" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="16" y2="-9" stroke="#D4A847" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Crescent on right of bridge -->
  <g transform="translate(315 200)">
    <path d="M 0 -14 A 14 14 0 1 0 0 14 A 11 11 0 1 1 0 -14" fill="url(#g1)"/>
  </g>

  <!-- Decorative dots -->
  <circle cx="200" cy="225" r="2" fill="#D4A847"/>
  <circle cx="180" cy="225" r="1.5" fill="#D4A847" opacity="0.6"/>
  <circle cx="220" cy="225" r="1.5" fill="#D4A847" opacity="0.6"/>
</svg>
