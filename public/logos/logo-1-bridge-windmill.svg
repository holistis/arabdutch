<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&display=swap');</style>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0CC74"/>
      <stop offset="0.5" stop-color="#D4A847"/>
      <stop offset="1" stop-color="#8B6515"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" fill="#0F1A30"/>

  <!-- Ornate decorative border top -->
  <g stroke="url(#g1)" fill="none">
    <path d="M 60 50 Q 250 25 440 50" stroke-width="1.2"/>
    <path d="M 70 60 Q 250 38 430 60" stroke-width="0.5" opacity="0.5"/>
  </g>
  <g fill="#D4A847">
    <circle cx="60" cy="50" r="3"/>
    <circle cx="440" cy="50" r="3"/>
    <circle cx="250" cy="28" r="2"/>
    <circle cx="155" cy="35" r="1.5"/>
    <circle cx="345" cy="35" r="1.5"/>
  </g>

  <!-- Ruqaa-style Arabic calligraphy -->
  <text x="250" y="190" font-family="'Aref Ruqaa', 'Amiri', serif"
        font-size="120" fill="url(#g1)" text-anchor="middle" font-weight="700"
        direction="rtl">
    عرب داتش
  </text>

  <!-- Bridge below -->
  <path d="M 90 230 Q 250 265 410 230" fill="none" stroke="url(#g1)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 90 230 Q 250 255 410 230" fill="none" stroke="#D4A847" stroke-width="0.5" opacity="0.5"/>
  <line x1="90" y1="230" x2="410" y2="230" stroke="url(#g1)" stroke-width="1.5"/>

  <!-- Windmill -->
  <g transform="translate(95 230)">
    <circle r="3.5" fill="#D4A847"/>
    <line x1="0" y1="0" x2="0" y2="-22" stroke="#D4A847" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="19" y2="11" stroke="#D4A847" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-19" y2="11" stroke="#D4A847" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="19" y2="-11" stroke="#D4A847" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Crescent -->
  <g transform="translate(405 230)">
    <path d="M 0 -16 A 16 16 0 1 0 0 16 A 13 13 0 1 1 0 -16" fill="url(#g1)"/>
  </g>

  <!-- Bottom ornament -->
  <g transform="translate(250 275)" fill="#D4A847">
    <polygon points="0,-5 4,0 0,5 -4,0"/>
    <circle cx="-15" r="1.5" opacity="0.7"/>
    <circle cx="15" r="1.5" opacity="0.7"/>
    <circle cx="-28" r="1" opacity="0.5"/>
    <circle cx="28" r="1" opacity="0.5"/>
  </g>
</svg>
