<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <linearGradient id="g4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8C16C"/>
      <stop offset="1" stop-color="#A67C1E"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="#0F1A30"/>

  <!-- Pointed arch (Islamic/Moorish style) -->
  <path d="M 130 220 L 130 100 Q 130 50 200 30 Q 270 50 270 100 L 270 220 Z"
        fill="none" stroke="url(#g4)" stroke-width="2.5"/>

  <!-- Inner pointed arch -->
  <path d="M 138 215 L 138 102 Q 138 56 200 38 Q 262 56 262 102 L 262 215 Z"
        fill="none" stroke="#D4A847" stroke-width="0.6" opacity="0.5"/>

  <!-- Top finial -->
  <line x1="200" y1="30" x2="200" y2="15" stroke="#D4A847" stroke-width="1.5"/>
  <circle cx="200" cy="13" r="3" fill="url(#g4)"/>
  <path d="M 200 5 A 3 3 0 1 0 200 11 A 2 2 0 1 1 200 5" fill="#D4A847"/>

  <!-- Geometric ornament inside top of arch -->
  <g transform="translate(200 75)" stroke="#D4A847" stroke-width="0.8" fill="none" opacity="0.7">
    <circle r="14"/>
    <circle r="9"/>
    <polygon points="0,-12 10,6 -10,6"/>
    <polygon points="0,12 -10,-6 10,-6"/>
  </g>

  <!-- Arabic calligraphy in center -->
  <text x="200" y="165" font-family="'Amiri', 'Scheherazade New', 'Noto Naskh Arabic', serif"
        font-size="56" fill="url(#g4)" text-anchor="middle" font-weight="700"
        direction="rtl">
    عرب داتش
  </text>

  <!-- Small bridge inside arch -->
  <path d="M 155 195 Q 200 175 245 195" fill="none" stroke="url(#g4)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Windmill (left) -->
  <g transform="translate(160 198)">
    <circle r="1.8" fill="#D4A847"/>
    <line x1="0" y1="0" x2="0" y2="-9" stroke="#D4A847" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="8" y2="5" stroke="#D4A847" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-8" y2="5" stroke="#D4A847" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <!-- Crescent (right) -->
  <g transform="translate(240 198)">
    <path d="M 0 -8 A 8 8 0 1 0 0 8 A 6 6 0 1 1 0 -8" fill="#D4A847"/>
  </g>

  <!-- Decorative bottom border -->
  <line x1="135" y1="220" x2="265" y2="220" stroke="url(#g4)" stroke-width="1.5"/>
  <polygon points="200,235 205,242 200,249 195,242" fill="#D4A847"/>
  <polygon points="170,235 173,239 170,243 167,239" fill="#D4A847" opacity="0.6"/>
  <polygon points="230,235 233,239 230,243 227,239" fill="#D4A847" opacity="0.6"/>
</svg>
