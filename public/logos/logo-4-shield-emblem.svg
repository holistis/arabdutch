<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <linearGradient id="gold4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D4A847"/>
      <stop offset="1" stop-color="#A67C1E"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="#0F1A30"/>

  <!-- Shield outline -->
  <path d="M 200 30 L 250 50 L 250 100 Q 250 145 200 165 Q 150 145 150 100 L 150 50 Z"
        fill="none" stroke="url(#gold4)" stroke-width="2.5"/>

  <!-- Inner decorative line -->
  <path d="M 200 38 L 244 55 L 244 100 Q 244 140 200 158 Q 156 140 156 100 L 156 55 Z"
        fill="none" stroke="#D4A847" stroke-width="0.5" opacity="0.5"/>

  <!-- Bridge inside shield -->
  <path d="M 165 115 Q 200 80 235 115" fill="none" stroke="url(#gold4)" stroke-width="3" stroke-linecap="round"/>
  <line x1="160" y1="115" x2="240" y2="115" stroke="url(#gold4)" stroke-width="2"/>

  <!-- Windmill above bridge (left) -->
  <g transform="translate(175 80)">
    <circle r="2" fill="#D4A847"/>
    <line x1="0" y1="0" x2="0" y2="-12" stroke="#D4A847" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="10" y2="6" stroke="#D4A847" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-10" y2="6" stroke="#D4A847" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Crescent above bridge (right) -->
  <g transform="translate(225 80)">
    <path d="M 0 -10 A 10 10 0 1 0 0 10 A 8 8 0 1 1 0 -10" fill="#D4A847"/>
  </g>

  <!-- Star at top -->
  <polygon points="200,55 202,60 207,60 203,63 205,68 200,65 195,68 197,63 193,60 198,60"
           fill="#D4A847"/>

  <!-- Arabic text inside shield -->
  <text x="200" y="148" font-family="Arial, sans-serif" font-size="12" fill="#D4A847" text-anchor="middle" letter-spacing="2">عرب داتش</text>

  <!-- Brand text below shield -->
  <text x="200" y="195" font-family="Georgia, serif" font-size="26" fill="#FFFFFF" text-anchor="middle" font-weight="700" letter-spacing="2">ArabDutch</text>
  <text x="200" y="218" font-family="Arial, sans-serif" font-size="10" fill="#D4A847" text-anchor="middle" letter-spacing="6">CONSULTANCY</text>
</svg>
