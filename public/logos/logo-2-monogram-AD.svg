<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="500" height="360">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@700&display=swap');</style>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0CC74"/>
      <stop offset="1" stop-color="#8B6515"/>
    </linearGradient>
  </defs>
  <rect width="500" height="360" fill="#0F1A30"/>

  <!-- Rub el Hizb (8-point star) — overlapping squares -->
  <g transform="translate(250 180)">
    <!-- Outer big star: two squares rotated 45° -->
    <rect x="-130" y="-130" width="260" height="260" fill="none" stroke="url(#g2)" stroke-width="2"/>
    <rect x="-130" y="-130" width="260" height="260" fill="none" stroke="url(#g2)" stroke-width="2" transform="rotate(45)"/>

    <!-- Inner star layer -->
    <rect x="-115" y="-115" width="230" height="230" fill="none" stroke="#D4A847" stroke-width="0.6" opacity="0.5"/>
    <rect x="-115" y="-115" width="230" height="230" fill="none" stroke="#D4A847" stroke-width="0.6" opacity="0.5" transform="rotate(45)"/>

    <!-- Central circle -->
    <circle r="90" fill="#0F1A30" stroke="url(#g2)" stroke-width="1.5"/>
    <circle r="84" fill="none" stroke="#D4A847" stroke-width="0.5" opacity="0.6"/>

    <!-- Spokes radiating from center -->
    <g stroke="url(#g2)" stroke-width="0.7" opacity="0.7">
      <line x1="0" y1="-90" x2="0" y2="-130"/>
      <line x1="0" y1="90" x2="0" y2="130"/>
      <line x1="-90" y1="0" x2="-130" y2="0"/>
      <line x1="90" y1="0" x2="130" y2="0"/>
      <line x1="-64" y1="-64" x2="-92" y2="-92"/>
      <line x1="64" y1="64" x2="92" y2="92"/>
      <line x1="-64" y1="64" x2="-92" y2="92"/>
      <line x1="64" y1="-64" x2="92" y2="-92"/>
    </g>

    <!-- Star tips ornaments -->
    <g fill="url(#g2)">
      <circle cx="0" cy="-130" r="3"/>
      <circle cx="0" cy="130" r="3"/>
      <circle cx="-130" cy="0" r="3"/>
      <circle cx="130" cy="0" r="3"/>
      <circle cx="-92" cy="-92" r="2.5"/>
      <circle cx="92" cy="-92" r="2.5"/>
      <circle cx="-92" cy="92" r="2.5"/>
      <circle cx="92" cy="92" r="2.5"/>
    </g>

    <!-- Inner small 8-point star above text -->
    <g transform="translate(0 -45)" fill="#D4A847">
      <polygon points="0,-7 2,-2 7,0 2,2 0,7 -2,2 -7,0 -2,-2"/>
    </g>

    <!-- Arabic Kufic text in center -->
    <text y="15" font-family="'Reem Kufi', sans-serif"
          font-size="56" fill="url(#g2)" text-anchor="middle" font-weight="700"
          direction="rtl" letter-spacing="2">
      عرب داتش
    </text>

    <!-- Decorative line below text -->
    <line x1="-50" y1="35" x2="50" y2="35" stroke="url(#g2)" stroke-width="0.8"/>
    <polygon points="0,32 4,35 0,38 -4,35" fill="#D4A847"/>

    <!-- Inner small ornaments -->
    <g transform="translate(0 55)" fill="#D4A847" opacity="0.7">
      <circle r="1.5"/>
      <circle cx="-12" r="1"/>
      <circle cx="12" r="1"/>
    </g>
  </g>

  <!-- Bottom motif -->
  <g transform="translate(250 340)" fill="url(#g2)">
    <polygon points="0,-6 6,0 0,6 -6,0"/>
    <polygon points="-20,-3 -17,0 -20,3 -23,0" opacity="0.7"/>
    <polygon points="20,-3 23,0 20,3 17,0" opacity="0.7"/>
  </g>
</svg>
