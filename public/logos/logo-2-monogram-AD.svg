<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8C16C"/>
      <stop offset="1" stop-color="#A67C1E"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="#0F1A30"/>

  <!-- Outer circular medallion -->
  <circle cx="200" cy="140" r="110" fill="none" stroke="url(#g2)" stroke-width="2"/>
  <circle cx="200" cy="140" r="103" fill="none" stroke="#D4A847" stroke-width="0.5" opacity="0.5"/>

  <!-- Islamic geometric pattern dots around -->
  <g fill="#D4A847">
    <circle cx="200" cy="30" r="2.5"/>
    <circle cx="200" cy="250" r="2.5"/>
    <circle cx="90" cy="140" r="2.5"/>
    <circle cx="310" cy="140" r="2.5"/>
    <circle cx="278" cy="62" r="2"/>
    <circle cx="122" cy="62" r="2"/>
    <circle cx="278" cy="218" r="2"/>
    <circle cx="122" cy="218" r="2"/>
  </g>

  <!-- Decorative arch top of medallion -->
  <path d="M 130 70 Q 200 40 270 70" fill="none" stroke="url(#g2)" stroke-width="1.5" opacity="0.8"/>

  <!-- Arabic calligraphy in center -->
  <text x="200" y="170" font-family="'Amiri', 'Scheherazade New', 'Noto Naskh Arabic', serif"
        font-size="68" fill="url(#g2)" text-anchor="middle" font-weight="700"
        direction="rtl">
    عرب داتش
  </text>

  <!-- Inner ornamental star -->
  <g transform="translate(200 215)" fill="#D4A847">
    <polygon points="0,-7 2,-2 7,-2 3,2 5,7 0,4 -5,7 -3,2 -7,-2 -2,-2"/>
  </g>

  <!-- Side ornaments -->
  <g transform="translate(120 140)" fill="#D4A847" opacity="0.6">
    <circle r="1.5"/>
    <circle cx="-8" r="1"/>
    <circle cx="-16" r="0.7"/>
  </g>
  <g transform="translate(280 140)" fill="#D4A847" opacity="0.6">
    <circle r="1.5"/>
    <circle cx="8" r="1"/>
    <circle cx="16" r="0.7"/>
  </g>
</svg>
