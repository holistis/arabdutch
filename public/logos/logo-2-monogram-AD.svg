<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@700&display=swap');</style>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0CC74"/>
      <stop offset="1" stop-color="#8B6515"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.5" cy="0.5">
      <stop offset="0" stop-color="#1A2744"/>
      <stop offset="1" stop-color="#0F1A30"/>
    </radialGradient>
  </defs>
  <rect width="500" height="320" fill="url(#bgGlow)"/>

  <!-- Outer ornate medallion -->
  <circle cx="250" cy="160" r="130" fill="none" stroke="url(#g2)" stroke-width="2.5"/>
  <circle cx="250" cy="160" r="120" fill="none" stroke="#D4A847" stroke-width="0.6" opacity="0.5"/>
  <circle cx="250" cy="160" r="113" fill="none" stroke="#D4A847" stroke-width="0.4" opacity="0.3"/>

  <!-- 8-point star pattern around medallion -->
  <g fill="#D4A847">
    <polygon points="250,28 252,33 257,33 253,36 255,41 250,38 245,41 247,36 243,33 248,33"/>
    <polygon points="250,292 252,287 257,287 253,284 255,279 250,282 245,279 247,284 243,287 248,287"/>
    <polygon points="118,160 123,158 123,153 126,157 131,155 128,160 131,165 126,163 123,167 123,162"/>
    <polygon points="382,160 377,158 377,153 374,157 369,155 372,160 369,165 374,163 377,167 377,162"/>
  </g>

  <!-- Decorative dots around -->
  <g fill="#D4A847" opacity="0.7">
    <circle cx="343" cy="67" r="2"/>
    <circle cx="157" cy="67" r="2"/>
    <circle cx="343" cy="253" r="2"/>
    <circle cx="157" cy="253" r="2"/>
  </g>

  <!-- Islamic geometric arch top -->
  <path d="M 165 95 Q 250 50 335 95" fill="none" stroke="url(#g2)" stroke-width="1.2"/>
  <path d="M 175 100 Q 250 65 325 100" fill="none" stroke="#D4A847" stroke-width="0.5" opacity="0.5"/>

  <!-- Classical Quranic Arabic calligraphy -->
  <text x="250" y="195" font-family="'Amiri Quran', 'Amiri', serif"
        font-size="78" fill="url(#g2)" text-anchor="middle" font-weight="700"
        direction="rtl">
    عرب داتش
  </text>

  <!-- Inner decorative line -->
  <line x1="180" y1="220" x2="320" y2="220" stroke="url(#g2)" stroke-width="0.8"/>
  <polygon points="250,217 254,220 250,223 246,220" fill="#D4A847"/>

  <!-- Below medallion ornament -->
  <g transform="translate(250 305)" fill="#D4A847">
    <path d="M -20 0 Q 0 -8 20 0 Q 0 5 -20 0 Z" stroke="#D4A847" stroke-width="0.5"/>
  </g>
</svg>
